<!doctype html>
<html><head><meta charset="utf-8"><title>start button fixture</title>
<style>#start{display:inline-block;padding:6px 14px;border:1px solid #999;cursor:pointer}</style></head>
<body>
<div id="x1">Range: 12</div>
<div id="x2">Thrust: <span id="x3">0</span></div>
<div id="x4"></div>
<div><span id="x5">Start</span></div>
<script>
  // Test fixture (not PhET content): ids are deliberately meaningless.
  let thrust = 0, running = false;
  document.getElementById('x5').style.cssText = 'display:inline-block;padding:6px 14px;border:1px solid #999;cursor:pointer';
  document.getElementById('x5').addEventListener('click', () => {
    if (running) return;
    running = true;
    setTimeout(() => {
      document.getElementById('x4').innerHTML = 'Landing&nbsp;speed&nbsp;=&nbsp;7.5&nbsp;m/s<br>HARD   landing';
    }, 500);
  });
  window.addEventListener('keydown', (e) => {
    if (running && e.key === 'ArrowUp') document.getElementById('x3').textContent = String(++thrust);
  });
</script>
</body></html>

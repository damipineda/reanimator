<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lunar Lander (PhET) — HTML5 rebuild</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; }

  /* "view_mc": the pannable/zoomable world container. See physics.js
     updateCamera() (BehaviorSpec rule: DoAction.as:162-193) for mag/Nmag/
     viewOffsetX; this element only applies them as a CSS transform. */
  #view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 90%; }
  #ground { position: absolute; left: 0; bottom: 10%; width: 100%; height: 4px; background: #654; }
  #landing-marks { position: absolute; left: 0; bottom: 10%; width: 100%; height: 0; }
  .landing-mark { position: absolute; bottom: 0; width: 2px; height: 14px; background: #0f0; font-size: 10px; text-align: center; }

  #lander-holder { position: absolute; }
  #lander { position: relative; width: 24px; height: 24px; background: #ccc; transform-origin: 50% 50%; }
  #thrust-flame { position: absolute; left: 10px; top: 24px; width: 4px; height: 20px; background: orange; transform-origin: 50% 0%; opacity: 0.2; }
  .side-thruster { position: absolute; width: 3px; height: 10px; background: #58f; opacity: 0; }
  .side-thruster.firing { opacity: 1; animation: pulse 0.15s ease-out; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  #left-thruster { left: -4px; top: 8px; }
  #right-thruster { left: 24px; top: 8px; }

  #gui-panel { position: absolute; left: 0; top: 0; width: 100%; padding: 6px 10px; display: flex; gap: 18px; background: rgba(0,0,0,0.5); font-size: 13px; }
  #gui-panel .gauge span.label { opacity: 0.7; margin-right: 4px; }
  #artificial-horizon { display: inline-block; width: 16px; height: 16px; border: 2px solid #0af; border-radius: 50%; }
  #fuel-gauge-track { display: inline-block; width: 60px; height: 8px; background: #333; vertical-align: middle; }
  #fuel-gauge { display: block; height: 100%; background: #0c6; width: 100%; }

  #score-panel { position: absolute; right: 10px; top: 60px; text-align: right; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 10px; }

  #boulder-crash-report, #landing-speed-report, #paused-sign, #help-plaque, #intro-plaque {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    background: rgba(20,20,20,0.9); border: 1px solid #888; padding: 10px 16px; text-align: center;
  }
  #landing-speed-report { top: 55%; }

  .control-button { position: relative; display: inline-block; padding: 6px 14px; border: 1px solid #999; background: #333; color: #eee; cursor: pointer; user-select: none; }
  .control-button.bold { font-weight: bold; }
  .control-button.nudged { transform: translate(2px, 2px); }
  #help-button.paused-icon { background: #654; }

  #controls-bar { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 8px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="view">
      <div id="ground"></div>
      <div id="landing-marks"></div>
      <div id="lander-holder">
        <div id="lander-body" data-frame="good">
          <div id="lander"></div>
          <div id="thrust-flame"></div>
          <div id="left-thruster" class="side-thruster"></div>
          <div id="right-thruster" class="side-thruster"></div>
        </div>
      </div>
    </div>

    <div id="gui-panel">
      <div class="gauge"><span class="label" id="height-label"></span><span id="height-value">0</span></div>
      <div class="gauge"><span class="label" id="thrust-label"></span><span id="thrust-value">0</span></div>
      <div class="gauge"><span class="label" id="range-label"></span><span id="range-value">0</span></div>
      <div class="gauge"><span class="label" id="vy-speed-label"></span><span id="vy-value">0</span></div>
      <div class="gauge"><span class="label" id="vx-speed-label"></span><span id="vx-value">0</span></div>
      <div class="gauge"><span class="label" id="fuel-label"></span><span id="fuel-gauge-track"><span id="fuel-gauge"></span></span></div>
      <div class="gauge" id="artificial-horizon"></div>
    </div>

    <div id="score-panel">
      <div><span id="score-label"></span>: <span id="score-value">0</span></div>
      <div><span id="soft-landings-label"></span>: <span id="soft-landings-value">0</span></div>
      <div><span id="hard-landings-label"></span>: <span id="hard-landings-value">0</span></div>
    </div>

    <div id="boulder-crash-report" hidden>Boulder crash!</div>

    <div id="landing-speed-report" hidden>
      <div id="message1"></div>
      <div id="message2"></div>
      <div id="message3"></div>
      <div id="message4"></div>
    </div>

    <div id="paused-sign" hidden></div>
    <div id="help-plaque" hidden></div>

    <div id="controls-bar">
      <div id="start-button" class="control-button"></div>
      <div id="reset-button" class="control-button"></div>
      <div id="help-button" class="control-button"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
